<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily To-Dos</title>
  <style>
    :root[data-theme="dark"] {
      --bg-color: #121212;
      --surface-color: #1a1a1a;
      --surface-border: #333333;
      --text-main: #f3f3f3;
      --text-muted: #9e9e9e;
      --accent: #d4af37; /* Brass/Craft Gold accent */
      --accent-hover: #e6c547;
      --input-bg: #161616;
      --item-bg: #1a1a1a;
      --item-alt-bg: #1e1e1e;
      --danger-bg: #3a1c1c;
      --danger-color: #ff6b6b;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    :root[data-theme="light"] {
      --bg-color: #f7f5f0; /* Warm artisan paper tone */
      --surface-color: #ffffff;
      --surface-border: #e0dcd0;
      --text-main: #1a1a1a;
      --text-muted: #737373;
      --accent: #b89728;
      --accent-hover: #a18220;
      --input-bg: #faf8f5;
      --item-bg: #ffffff;
      --item-alt-bg: #faf8f5;
      --danger-bg: #fde8e8;
      --danger-color: #d32f2f;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      font-family: "Courier New", Courier, monospace, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px; /* Increased baseline font size */
      letter-spacing: 0.5px;
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .xp-window {
      width: 100%;
      max-width: 760px;
      background-color: var(--surface-color);
      border: 2px solid var(--surface-border);
      border-radius: 0px; /* Sharp corners */
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .xp-title-bar {
      background-color: var(--surface-color);
      border-bottom: 2px solid var(--surface-border);
      color: var(--text-main);
      padding: 18px 24px;
      font-weight: 700;
      font-size: 16px; /* Increased font size */
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .xp-title-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-toggle {
      background: transparent;
      border: 1px solid var(--surface-border);
      color: var(--text-main);
      border-radius: 0px; /* Sharp corners */
      padding: 6px 12px;
      cursor: pointer;
      font-size: 13px; /* Increased font size */
      text-transform: uppercase;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .xp-title-controls button:not(.theme-toggle) {
      width: 30px;
      height: 30px;
      font-size: 14px;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--surface-border);
      border-radius: 0px; /* Sharp corners */
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .xp-title-controls button:not(.theme-toggle):hover {
      background: var(--danger-color);
      color: white;
      border-color: var(--danger-color);
    }

    .xp-body {
      padding: 28px;
    }

    .fieldset-box {
      border: 1px solid var(--surface-border);
      border-radius: 0px; /* Sharp corners */
      padding: 18px;
      margin-bottom: 24px;
      background: transparent;
    }

    .fieldset-box legend {
      color: var(--accent);
      font-weight: 700;
      font-size: 13px; /* Increased font size */
      text-transform: uppercase;
      padding: 0 8px;
    }

    .date-picker-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    label {
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 13px; /* Increased font size */
    }

    input[type="date"], input[type="text"] {
      border: 1px solid var(--surface-border);
      padding: 12px 14px;
      border-radius: 0px; /* Sharp corners */
      background: var(--input-bg);
      color: var(--text-main);
      outline: none;
      font-size: 15px; /* Increased font size */
    }

    input[type="date"]:focus, input[type="text"]:focus {
      border-color: var(--accent);
    }

    .add-task-row {
      display: flex;
      gap: 12px;
    }

    .add-task-row input[type="text"] {
      flex: 1;
    }

    .xp-btn {
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 0px; /* Sharp corners */
      padding: 12px 20px;
      font-size: 14px; /* Increased font size */
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      color: #121212;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .xp-btn:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .task-list {
      list-style: none;
      padding: 0;
      margin: 0;
      height: 350px;
      overflow-y: auto;
      background: transparent;
      border: none;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border: 1px solid var(--surface-border);
      border-radius: 0px; /* Sharp corners */
      margin-bottom: 10px;
      background-color: var(--item-bg);
      font-size: 15px; /* Increased font size */
    }

    .task-item:nth-child(even) {
      background-color: var(--item-alt-bg);
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      margin-right: 12px;
      word-break: break-word;
    }

    .task-left input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
      border-radius: 0px;
    }

    .task-text {
      cursor: pointer;
      padding: 2px 6px;
      border: 1px dashed transparent;
    }

    .task-text:hover {
      border-color: var(--accent);
      background: var(--input-bg);
    }

    .task-edit-input {
      flex: 1;
      font-size: 15px;
      padding: 6px 10px;
      border: 1px solid var(--accent);
      background: var(--input-bg);
      color: var(--text-main);
      outline: none;
      border-radius: 0px;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: var(--text-muted);
      opacity: 0.7;
    }

    .btn-delete {
      background: var(--danger-bg);
      border: 1px solid var(--surface-border);
      color: var(--danger-color);
      width: 30px;
      height: 30px;
      border-radius: 0px; /* Sharp corners */
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .btn-delete:hover {
      background: var(--danger-color);
      color: white;
      border-color: var(--danger-color);
    }

    .empty-state {
      padding: 50px 20px;
      text-align: center;
      color: var(--text-muted);
      font-style: italic;
      font-size: 14px;
    }

    .xp-footer {
      border-top: 1px solid var(--surface-border);
      padding-top: 20px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .xp-footer .xp-btn {
      background: transparent;
      border: 1px solid var(--surface-border);
      color: var(--text-main);
      font-weight: 600;
    }

    .xp-footer .xp-btn:hover {
      background: var(--surface-border);
      color: var(--accent);
    }

    #fileInput {
      display: none;
    }
  </style>
</head>
<body>

  <div class="xp-window">
    <!-- Title Bar -->
    <div class="xp-title-bar">
      <span>Deep Work ToDos</span>
      <div class="xp-title-controls">
        <button class="theme-toggle" id="themeToggleBtn">Mode</button>
      </div>
    </div>

    <div class="xp-body">
      <!-- Date Selection & Input Panel -->
      <fieldset class="fieldset-box">
        <legend>Schedule Index</legend>
        <div class="date-picker-row">
          <label for="taskDate">Target Day:</label>
          <input type="date" id="taskDate" />
          <button class="xp-btn" id="todayBtn">Today</button>
        </div>
      </fieldset>

      <fieldset class="fieldset-box">
        <legend>New Entry</legend>
        <div class="add-task-row">
          <input type="text" id="taskInput" placeholder="Record a new task..." />
          <button class="xp-btn" id="addTaskBtn">Commit</button>
        </div>
      </fieldset>

      <!-- Task List Area -->
      <fieldset class="fieldset-box">
        <legend id="listLegend">Collection</legend>
        <ul class="task-list" id="taskList">
          <!-- Tasks dynamically rendered here -->
        </ul>
      </fieldset>

      <!-- Backup / Restore Footer -->
      <div class="xp-footer">
        <button class="xp-btn" id="backupBtn">Export Archive (.txt)</button>
        <button class="xp-btn" id="restoreBtn">Import Archive (.txt)</button>
        <input type="file" id="fileInput" accept=".txt" />
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "artcraft_todos_db";

    // DOM Elements
    const taskDateInput = document.getElementById("taskDate");
    const todayBtn = document.getElementById("todayBtn");
    const taskInput = document.getElementById("taskInput");
    const addTaskBtn = document.getElementById("addTaskBtn");
    const taskList = document.getElementById("taskList");
    const listLegend = document.getElementById("listLegend");
    const backupBtn = document.getElementById("backupBtn");
    const restoreBtn = document.getElementById("restoreBtn");
    const fileInput = document.getElementById("fileInput");
    const themeToggleBtn = document.getElementById("themeToggleBtn");

    let db = {};

    function initTheme() {
      const savedTheme = localStorage.getItem("artcraft_todos_theme") || "dark";
      document.documentElement.setAttribute("data-theme", savedTheme);
      themeToggleBtn.innerHTML = savedTheme === "dark" ? "☀️ Light" : "🌙 Dark";
    }

    themeToggleBtn.addEventListener("click", () => {
      const currentTheme = document.documentElement.getAttribute("data-theme");
      const newTheme = currentTheme === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", newTheme);
      localStorage.setItem("artcraft_todos_theme", newTheme);
      themeToggleBtn.innerHTML = newTheme === "dark" ? "☀️ Light" : "🌙 Dark";
    });

    function init() {
      initTheme();
      loadDB();
      setToday();
      
      taskDateInput.addEventListener("change", renderTasks);
      todayBtn.addEventListener("click", () => { setToday(); renderTasks(); });
      addTaskBtn.addEventListener("click", addTask);
      taskInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") addTask();
      });

      backupBtn.addEventListener("click", exportBackup);
      restoreBtn.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", importBackup);
    }

    function setToday() {
      const today = new Date().toISOString().split("T")[0];
      taskDateInput.value = today;
      renderTasks();
    }

    function loadDB() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) {
        try {
          db = JSON.parse(data);
        } catch (e) {
          db = {};
        }
      }
    }

    function saveDB() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    }

    function renderTasks() {
      const selectedDate = taskDateInput.value;
      listLegend.innerText = `Tasks — ${selectedDate || "Selected Day"}`;
      taskList.innerHTML = "";

      if (!selectedDate) {
        taskList.innerHTML = `<li class="empty-state">Please specify a target date.</li>`;
        return;
      }

      const tasks = db[selectedDate] || [];

      if (tasks.length === 0) {
        taskList.innerHTML = `<li class="empty-state">No entries recorded for this schedule.</li>`;
        return;
      }

      tasks.forEach((task, index) => {
        const li = document.createElement("li");
        li.className = `task-item ${task.completed ? "completed" : ""}`;

        const leftDiv = document.createElement("div");
        leftDiv.className = "task-left";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.addEventListener("change", () => toggleTask(selectedDate, index));

        const span = document.createElement("span");
        span.className = "task-text";
        span.textContent = task.text;
        span.title = "Click to edit task";
        span.addEventListener("click", () => enableEditTask(selectedDate, index, leftDiv, span));

        leftDiv.appendChild(checkbox);
        leftDiv.appendChild(span);

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "btn-delete";
        deleteBtn.innerHTML = "&times;";
        deleteBtn.title = "Delete Entry";
        deleteBtn.addEventListener("click", () => deleteTask(selectedDate, index));

        li.appendChild(leftDiv);
        li.appendChild(deleteBtn);
        taskList.appendChild(li);
      });
    }

    function enableEditTask(date, index, container, spanElement) {
      if (!db[date] || !db[date][index]) return;

      const editInput = document.createElement("input");
      editInput.type = "text";
      editInput.className = "task-edit-input";
      editInput.value = db[date][index].text;

      const saveEdit = () => {
        const newText = editInput.value.trim();
        if (newText) {
          db[date][index].text = newText;
          saveDB();
        }
        renderTasks();
      };

      editInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") saveEdit();
        if (e.key === "Escape") renderTasks();
      });

      editInput.addEventListener("blur", saveEdit);

      container.replaceChild(editInput, spanElement);
      editInput.focus();
    }

    function addTask() {
      const selectedDate = taskDateInput.value;
      const text = taskInput.value.trim();

      if (!selectedDate) {
        alert("Please choose a date first!");
        return;
      }

      if (!text) return;

      if (!db[selectedDate]) {
        db[selectedDate] = [];
      }

      db[selectedDate].push({
        id: Date.now(),
        text: text,
        completed: false
      });

      saveDB();
      taskInput.value = "";
      renderTasks();
    }

    function toggleTask(date, index) {
      if (db[date] && db[date][index]) {
        db[date][index].completed = !db[date][index].completed;
        saveDB();
        renderTasks();
      }
    }

    function deleteTask(date, index) {
      if (db[date]) {
        db[date].splice(index, 1);
        if (db[date].length === 0) {
          delete db[date];
        }
        saveDB();
        renderTasks();
      }
    }

    function exportBackup() {
      const dataStr = JSON.stringify(db, null, 2);
      const blob = new Blob([dataStr], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement("a");
      a.href = url;
      a.download = `atelier-todo-archive-${new Date().toISOString().split("T")[0]}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importBackup(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          if (typeof importedData === "object" && importedData !== null) {
            db = importedData;
            saveDB();
            renderTasks();
            alert("Archive successfully imported into local storage!");
          } else {
            throw new Error("Invalid format");
          }
        } catch (err) {
          alert("Error loading file: Please ensure it is a valid backup archive .txt file.");
        }
      };
      reader.readAsText(file);
      fileInput.value = "";
    }

    init();
  </script>
</body>
</html>
